name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGES_AUTH_TOKEN: ${{ secrets.GEOCAT_PACKAGES_TOKEN }}

      - name: Build
        run: npm run build

      - name: Build Check
        run: npm run build:check

      - name: Run tests
        run: npm test -- --watch=false
