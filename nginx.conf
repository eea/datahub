proxy_cache_path /tmp/eea-website keys_zone=eea_website:1m max_size=10m inactive=1d use_temp_path=off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Served behind Apache, so keep redirects relative to the public host.
    absolute_redirect off;

    # Apache does not compress, so do it here. text/html is always included.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime settings for the UI, filled in from the container environment
    # when it starts (this file is an envsubst template, see the Dockerfile).
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"geonetworkApiUrl": "${GEONETWORK_API_URL}"}';
    }

    location = /sitemap.xml {
        return 302 ${GEONETWORK_API_URL}/ogcapi-records/collections/d1bd08f0-16ac-47c3-b581-2e8db715530b/items?f=sitemap&limit=-1&filter=resourceType%20%3D%20%27series%27%20AND%20status%20%3C%3E%20%27obsolete%27%20AND%20status%20%3C%3E%20%27superseded%27;
    }

    location = /eea-website/@actions {
        limit_except GET {
            deny all;
        }
        resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off;
        set $eea_website https://www.eea.europa.eu;
        # The trailing "?" drops the query string.
        rewrite ^ /++api++/en/datahub/@actions? break;
        proxy_pass $eea_website;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache eea_website;
        proxy_cache_key eea-website-actions;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
    }

    # Files with a content hash in their name (outputHashing: all), such as
    # main-2HSMB3YI.js or chunk-CSW7XkvV.js, never change, so browsers can
    # keep them for a year. A missing one is a 404, not the SPA fallback.
    location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
