@if (records().length) {
  <section aria-labelledby="popular-records-title">
    <h2 id="popular-records-title" class="text-h2 mb-6">
      {{ 'find.landing.popular.title' | translate }}
    </h2>
    <p-carousel
      [value]="records()"
      [numVisible]="CARDS_PER_PAGE"
      [numScroll]="CARDS_PER_PAGE"
      [responsiveOptions]="responsiveOptions"
      [showNavigators]="false"
    >
      <ng-template #item let-record>
        <!-- Half the 20px gap on each side of every card. -->
        <a [routerLink]="record.link" class="group block px-2.5 text-foreground">
          @if (record.image) {
            <img
              [src]="record.image"
              alt=""
              class="w-full h-[200px] object-cover"
              (error)="dropImage(record)"
            />
          } @else {
            <div class="w-full h-[200px] bg-muted"></div>
          }
          <p class="text-paragraph text-right mt-2">
            {{ 'find.landing.popular.views' | translate: { count: record.views } }}
          </p>
          <h3 class="font-bold text-[18px] leading-[22px] group-hover:underline">
            {{ record.title }}
          </h3>
        </a>
      </ng-template>
    </p-carousel>
    <div class="flex justify-end">
      <button pButton type="button" (click)="seeAll()">
        {{ 'find.landing.popular.seeAll' | translate }}
      </button>
    </div>
  </section>
}
