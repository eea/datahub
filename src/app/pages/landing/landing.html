<div class="min-h-screen bg-background">
  <app-header />

  <div class="bg-primary">
    <div class="max-w-7xl mx-auto px-6 pt-16 pb-10">
      <p class="text-h1 text-primary-contrast">
        {{ 'find.appName' | translate }}
      </p>
    </div>
  </div>

  <section class="max-w-7xl mx-auto px-6 pt-20 md:pt-32">
    <!-- Search and filter area: identical to the one on the search results page -->
    <app-search-panel
      class="block mb-10"
      (search)="onSearch()"
      (filtersChange)="onFiltersChange()"
    ></app-search-panel>
    <img
      src="placeholders/intro.webp"
      [alt]="'find.landing.placeholder.intro' | translate"
      class="w-full"
    />
    <img
      src="placeholders/topics.webp"
      [alt]="'find.landing.placeholder.topics' | translate"
      class="w-full mt-18"
    />
  </section>

  <div class="my-12 py-16 bg-[#f2f3f4]">
    <div class="max-w-7xl mx-auto px-6">
      <img
        src="placeholders/resource-types.webp"
        [alt]="'find.landing.placeholder.resourceTypes' | translate"
        class="w-full"
      />
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 py-12">
    <img
      src="placeholders/popular-records.webp"
      [alt]="'find.landing.placeholder.popularRecords' | translate"
      class="w-full"
    />
  </div>

  <app-footer />
</div>

<p-dialog
  [visible]="isSignInModalOpen()"
  (visibleChange)="onSignInModalVisibilityChange($event)"
  (onHide)="closeSignInModal()"
  [modal]="true"
  [showHeader]="false"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  appendTo="body"
  [style]="{ width: '425px' }"
  [contentStyle]="{ padding: '24px' }"
  styleClass="bg-card border border-border rounded-md"
>
  <div class="flex items-start justify-between gap-4 mb-4">
    <div>
      <h3 class="text-h3">
        {{ 'find.landing.signInModal.title' | translate }}
      </h3>
      <p class="text-muted-foreground mt-1 text-body">
        {{ 'find.landing.signInModal.subtitle' | translate }}
      </p>
    </div>
    <button
      type="button"
      (click)="closeSignInModal()"
      [attr.aria-label]="'find.landing.signInModal.close' | translate"
      class="h-7 w-7 flex items-center justify-center rounded-md text-muted-foreground hover:text-foreground hover:bg-secondary transition-colors shrink-0"
    >
      <i class="pi pi-times text-[0.75rem]!"></i>
    </button>
  </div>

  <form (ngSubmit)="onSignInSubmit()" class="space-y-4">
    <div class="space-y-2">
      <label for="modal-username" class="text-label font-medium">
        {{ 'find.landing.signInModal.email' | translate }}
      </label>
      <input
        id="modal-username"
        pInputText
        name="email"
        type="email"
        [(ngModel)]="signInEmail"
        [placeholder]="'find.landing.signInModal.emailPlaceholder' | translate"
        autocomplete="email"
        inputmode="email"
        required
        class="!w-full !h-9 !border !border-border !rounded-md !bg-input placeholder:!text-muted-foreground !shadow-none"
      />
    </div>

    <div class="space-y-2">
      <label for="modal-password" class="text-label font-medium">
        {{ 'find.landing.signInModal.password' | translate }}
      </label>
      <input
        id="modal-password"
        pInputText
        name="password"
        type="password"
        [(ngModel)]="signInPassword"
        [placeholder]="'find.landing.signInModal.passwordPlaceholder' | translate"
        autocomplete="current-password"
        required
        class="!w-full !h-9 !border !border-border !rounded-md !bg-input placeholder:!text-muted-foreground !shadow-none"
      />
    </div>

    @if (signInError()) {
      <p class="text-destructive text-body">{{ signInError() }}</p>
    }

    <div class="text-muted-foreground bg-secondary p-3 rounded-md border border-border text-label">
      {{ 'find.landing.signInModal.demoHint' | translate }}
      <span class="text-foreground font-semibold">
        {{ 'find.landing.signInModal.demoPassword' | translate }}
      </span>
    </div>

    <button
      pButton
      type="submit"
      [disabled]="isSigningIn()"
      class="w-full h-9 px-4 rounded-md transition-colors text-body font-medium"
    >
      {{
        isSigningIn()
          ? ('find.landing.signInModal.submitting' | translate)
          : ('find.landing.signInModal.submit' | translate)
      }}
    </button>
  </form>
</p-dialog>
