<div class="min-h-screen bg-background">
  <header class="bg-linear-[#f2f3f4_11.3%,#e6e7e8_11.3%_27.6%,#fff_27.6%]">
    <div class="max-w-7xl mx-auto px-6">
      <img
        src="placeholders/header.webp"
        [alt]="'find.landing.placeholder.header' | translate"
        class="w-full"
      />
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-6 py-20 md:py-32">
    <!-- Search and filter area: identical to the one on the search results page -->
    <app-search-panel
      class="block mb-10"
      (search)="onSearch()"
      (filtersChange)="onFiltersChange()"
    ></app-search-panel>
  </section>

  <footer
    class="mt-20 bg-[image:linear-gradient(#1a3d42,#202e39_33%,#222d38_67%),linear-gradient(#02796b,#134f4f)] bg-size-[50%_100%] bg-position-[left,right] bg-no-repeat"
  >
    <div class="max-w-7xl mx-auto px-6">
      <img
        src="placeholders/footer.webp"
        [alt]="'find.landing.placeholder.footer' | translate"
        class="w-full"
      />
    </div>
  </footer>
</div>

<p-dialog
  [visible]="isSignInModalOpen()"
  (visibleChange)="onSignInModalVisibilityChange($event)"
  (onHide)="closeSignInModal()"
  [modal]="true"
  [showHeader]="false"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  appendTo="body"
  [style]="{ width: '425px' }"
  [contentStyle]="{ padding: '24px' }"
  styleClass="bg-card border border-border rounded-card"
>
  <div class="flex items-start justify-between gap-4 mb-4">
    <div>
      <h3
        class="text-card-foreground"
        style="font-size: var(--text-h3); font-weight: var(--font-weight-semibold)"
      >
        {{ 'find.landing.signInModal.title' | translate }}
      </h3>
      <p class="text-muted-foreground mt-1" style="font-size: var(--text-base)">
        {{ 'find.landing.signInModal.subtitle' | translate }}
      </p>
    </div>
    <button
      type="button"
      (click)="closeSignInModal()"
      [attr.aria-label]="'find.landing.signInModal.close' | translate"
      class="h-7 w-7 flex items-center justify-center rounded-button text-muted-foreground hover:text-foreground hover:bg-secondary transition-colors shrink-0"
    >
      <i class="pi pi-times" style="font-size: 0.75rem"></i>
    </button>
  </div>

  <form (ngSubmit)="onSignInSubmit()" class="space-y-4">
    <div class="space-y-2">
      <label
        for="modal-username"
        class="text-card-foreground"
        style="font-size: var(--text-label); font-weight: var(--font-weight-medium)"
      >
        {{ 'find.landing.signInModal.email' | translate }}
      </label>
      <input
        id="modal-username"
        pInputText
        name="email"
        type="email"
        [(ngModel)]="signInEmail"
        [placeholder]="'find.landing.signInModal.emailPlaceholder' | translate"
        autocomplete="email"
        inputmode="email"
        required
        class="!w-full !h-9 !border !border-border !rounded-button !bg-input-background !text-foreground placeholder:!text-muted-foreground !shadow-none"
      />
    </div>

    <div class="space-y-2">
      <label
        for="modal-password"
        class="text-card-foreground"
        style="font-size: var(--text-label); font-weight: var(--font-weight-medium)"
      >
        {{ 'find.landing.signInModal.password' | translate }}
      </label>
      <input
        id="modal-password"
        pInputText
        name="password"
        type="password"
        [(ngModel)]="signInPassword"
        [placeholder]="'find.landing.signInModal.passwordPlaceholder' | translate"
        autocomplete="current-password"
        required
        class="!w-full !h-9 !border !border-border !rounded-button !bg-input-background !text-foreground placeholder:!text-muted-foreground !shadow-none"
      />
    </div>

    @if (signInError()) {
      <p class="text-destructive" style="font-size: var(--text-base)">{{ signInError() }}</p>
    }

    <div
      class="text-muted-foreground bg-secondary p-3 rounded-md border border-border"
      style="font-size: var(--text-label)"
    >
      {{ 'find.landing.signInModal.demoHint' | translate }}
      <span class="text-foreground" style="font-weight: var(--font-weight-semibold)">
        {{ 'find.landing.signInModal.demoPassword' | translate }}
      </span>
    </div>

    <button
      pButton
      type="submit"
      [disabled]="isSigningIn()"
      class="w-full h-9 px-4 rounded-button transition-colors"
      style="font-size: var(--text-base); font-weight: var(--font-weight-medium)"
    >
      {{
        isSigningIn()
          ? ('find.landing.signInModal.submitting' | translate)
          : ('find.landing.signInModal.submit' | translate)
      }}
    </button>
  </form>
</p-dialog>
