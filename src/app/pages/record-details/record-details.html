<div class="min-h-screen bg-tertiary">
  <app-header />

  <article class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6">
        @if (recordResource.isLoading()) {
          <app-record-skeleton />
        } @else if (recordStatus()) {
          <p-message severity="error">
            {{ recordStatus() | translate: { uuid: recordUuid() } }}
          </p-message>
        } @else {
          <p-card>
            <app-record-field-title [record]="record()" />
          </p-card>
        }
      </div>
    </div>
  </article>
</div>
