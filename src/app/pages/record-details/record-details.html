<div class="min-h-screen bg-tertiary">
  <app-header />

  <article class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6">
        @if (recordResource.isLoading()) {
          <app-record-skeleton />
        } @else if (recordStatus()) {
          <p-message severity="error">
            {{ recordStatus() | translate: { uuid: recordUuid() } }}
          </p-message>
        } @else {
          <p-card>
            <div class="flex items-center gap-3 mb-4">
              <app-record-field-type [record]="record()" />

              <app-record-field-org-for-resource [record]="record()" />
            </div>

            <app-record-field-title [record]="record()" />

            <div class="space-y-2 mb-5">
              <app-record-field-themes
                [record]="record()"
                class="flex flex-wrap gap-2 items-center"
              />

              <app-record-field-keywords
                [record]="record()"
                class="flex flex-wrap gap-2 items-center"
              />
            </div>

            <app-record-description [record]="record()" />
          </p-card>
        }
      </div>
    </div>
  </article>
</div>
