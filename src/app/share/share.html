<button
  type="button"
  (click)="toggle(sharePopover, $event)"
  aria-haspopup="dialog"
  class="flex items-center gap-1 text-base text-primary-contrast cursor-pointer"
  data-testid="share-button"
>
  <i class="pi pi-share-alt text-[1.1rem]!" aria-hidden="true"></i>
  {{ 'find.share.button' | translate }}
</button>
<p-popover #sharePopover>
  <p class="text-base font-medium">{{ 'find.share.title' | translate }}</p>
  <ul class="flex gap-1 mt-3.5">
    @for (link of links(); track link.icon) {
      <li>
        <a
          [href]="link.href"
          target="_blank"
          rel="noopener"
          class="text-primary hover:text-primary-700"
        >
          <i class="pi text-[1.1rem]!" [class]="link.icon" aria-hidden="true"></i>
          <span class="sr-only">{{ link.label | translate }}</span>
        </a>
      </li>
    }
  </ul>
</p-popover>
